
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出欠状況確認</title>
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            font-size: 16px;
        }
        .status-count { margin-left: 10px; font-weight: bold; }
        .status-filter { 
            margin-bottom: 15px; 
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-filter label {
            display: flex;
            align-items: center;
            margin-right: 15px;
            margin-bottom: 5px;
        }
        .status-filter input[type="checkbox"] {
            margin-right: 5px;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table { 
            border: 1px solid #ccc; 
            border-collapse: collapse; 
            width: 100%;
            min-width: 500px;
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 8px; 
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }
        select, button {
            padding: 8px 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-top: 0;
        }
        .form-container {
            margin-bottom: 20px;
        }
        
        /* Mobile responsive styles */
        @media screen and (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 14px;
            }
            .status-filter {
                flex-direction: column;
            }
            .status-filter label {
                margin-right: 0;
                font-size: 14px;
            }
            th, td {
                padding: 6px;
                font-size: 12px;
            }
            select, button {
                width: 100%;
                margin: 3px 0;
                padding: 10px;
                font-size: 16px; /* Prevent zoom on iOS */
            }
            .form-container {
                display: flex;
                flex-direction: column;
            }
            .form-container label {
                margin-bottom: 5px;
            }
        }
        
        @media screen and (max-width: 480px) {
            h2 {
                font-size: 18px;
            }
            th, td {
                padding: 4px;
                font-size: 11px;
            }
            table {
                min-width: 400px;
            }
        }
    </style>
</head>
<body>
<h2>セミナー出欠状況</h2>
<div class="form-container">
    <form action="/attendance_status" method="GET">
    <label for="seminar_id">セミナーを選択：</label>
    <select name="seminar_id">
      {% for seminar in seminars %}
        <option value="{{ seminar.id }}" {% if seminar.id == latest_seminar_id %}selected{% endif %}>
          {{ seminar.title }}
        </option>
      {% endfor %}
    </select>
    <button type="submit">表示</button>
    </form>
</div>
<div class="status-filter">
<label><input checked="" class="status-checkbox" type="checkbox" value="attend"/> 出席 (<span id="count-attend">0</span>)</label>
<label><input checked="" class="status-checkbox" type="checkbox" value="confirmed"/> 到着確認済 (<span id="count-confirmed">0</span>)</label>
<label><input class="status-checkbox" type="checkbox" value="pending"/> 保留 (<span id="count-pending">0</span>)</label>
<label><input class="status-checkbox" type="checkbox" value="absent"/> 欠席 (<span id="count-absent">0</span>)</label>
</div>
<div class="table-container">
    <table id="attendance-table">
    <thead>
    <tr>
    <th>氏名</th>
    <th>メール</th>
    <th>ステータス</th>
    </tr>
    </thead>
    <tbody>
                {% for attendance in attendances %}
                    <tr data-status="{{ attendance.status }}">
    <td>{{ attendance.recipient.name }}</td>
    <td>{{ attendance.recipient.email }}</td>
    <td class="status">{{ attendance.status }}</td>
    </tr>
                {% endfor %}
            </tbody>
    </table>
</div>
<script>
        function updateCountsAndVisibility() {
            const checkboxes = document.querySelectorAll('.status-checkbox');
            const activeStatuses = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            const rows = document.querySelectorAll('#attendance-table tbody tr');
            const counts = {};

            rows.forEach(row => {
                const status = row.getAttribute('data-status');
                if (activeStatuses.includes(status)) {
                    row.style.display = '';
                    counts[status] = (counts[status] || 0) + 1;
                } else {
                    row.style.display = 'none';
                }
            });

            ['attend', 'confirmed', 'pending', 'absent'].forEach(status => {
                document.getElementById('count-' + status).textContent = counts[status] || 0;
            });
        }

        document.querySelectorAll('.status-checkbox').forEach(cb => {
            cb.addEventListener('change', updateCountsAndVisibility);
        });

        window.addEventListener('DOMContentLoaded', updateCountsAndVisibility);
    </script>
</body>
</html>
