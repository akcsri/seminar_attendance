
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>出欠状況確認</title>
<style>
        .status-count { margin-left: 10px; font-weight: bold; }
        .status-filter { margin-bottom: 10px; }
        table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 5px; }
    </style>
<meta content="width=device-width, initial-scale=1" name="viewport"/><style>
    body {
        font-size: 16px;
        padding: 10px;
        margin: 0;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        overflow-x: auto;
        display: block;
    }
    th, td {
        padding: 8px;
        text-align: left;
        font-size: 14px;
    }
    @media screen and (max-width: 600px) {
        th, td {
            font-size: 12px;
        }
    }
    </style></head>
<body>
<h2>セミナー出欠状況</h2>
<form action="/attendance_status" method="GET">
<label for="seminar_id">セミナーを選択：</label>
<select id="seminar_id" name="seminar_id">
            {% for seminar in seminars %}
                <option %}="" %}selected{%="" endif="" if="" seminar.id="latest_seminar_id" value="{{ seminar.id }}" {%="">
                    {{ seminar.title }}
                </option>
            {% endfor %}
        </select>
<button type="submit">表示</button>
</form>
<div class="status-filter">
<label><input checked="" class="status-checkbox" type="checkbox" value="attend"/> 出席 (<span id="count-attend">0</span>)</label>
<label><input checked="" class="status-checkbox" type="checkbox" value="confirmed"/> 到着確認済 (<span id="count-confirmed">0</span>)</label>
<label><input class="status-checkbox" type="checkbox" value="pending"/> 保留 (<span id="count-pending">0</span>)</label>
<label><input class="status-checkbox" type="checkbox" value="absent"/> 欠席 (<span id="count-absent">0</span>)</label>
</div>
<table id="attendance-table">
<thead>
<tr>
<th>氏名</th>
<th>メール</th>
<th>ステータス</th>
</tr>
</thead>
<tbody>
            {% for attendance in attendances %}
                <tr data-status="{{ attendance.status }}">
<td>{{ attendance.recipient.name }}</td>
<td>{{ attendance.recipient.email }}</td>
<td class="status">{{ attendance.status }}</td>
</tr>
            {% endfor %}
        </tbody>
</table>
<script>
        function updateCountsAndVisibility() {
            const checkboxes = document.querySelectorAll('.status-checkbox');
            const activeStatuses = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            const rows = document.querySelectorAll('#attendance-table tbody tr');
            const counts = {};

            rows.forEach(row => {
                const status = row.getAttribute('data-status');
                if (activeStatuses.includes(status)) {
                    row.style.display = '';
                    counts[status] = (counts[status] || 0) + 1;
                } else {
                    row.style.display = 'none';
                }
            });

            ['attend', 'confirmed', 'pending', 'absent'].forEach(status => {
                document.getElementById('count-' + status).textContent = counts[status] || 0;
            });
        }

        document.querySelectorAll('.status-checkbox').forEach(cb => {
            cb.addEventListener('change', updateCountsAndVisibility);
        });

        window.addEventListener('DOMContentLoaded', updateCountsAndVisibility);
    </script>
</body>
</html>
