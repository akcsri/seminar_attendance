
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>セミナー参加確認</title>
</head>
<body>
    <p>{{ recipient.name }} 様</p>
    <p>以下のセミナーへのご参加ありがとうございます。</p>
    <p><strong>{{ seminar.title }}</strong></p>
    <p>会場に到着されましたら、以下の「確認」ボタンをクリックしてください。</p>
    <p>
        <a href="https://seminar-attendance.onrender.com/confirm?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}"
           style="display:inline-block;padding:10px 20px;background-color:#4CAF50;color:white;text-decoration:none;border-radius:5px;">
           確認
        </a>
    </p>
</body>
</html>
