
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セミナー参加確認</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc, #ffffff);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.08);
            border: 2px solid #e5e7eb;
        }
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        /* Outlook-compatible button styling */
        .btn-table {
            margin: 0 auto;
        }
        .btn-cell {
            background: linear-gradient(135deg, #4f46e5, #06d6a0);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-link {
            display: inline-block;
            padding: 15px 30px;
            color: white !important;
            text-decoration: none !important;
            font-weight: bold;
            font-size: 16px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #06d6a0);
            border: none;
            font-family: Arial, sans-serif;
            transition: all 0.3s ease;
        }
        .btn-link:hover {
            background: #e5e7eb !important;
            color: #1f2937 !important;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 25px;
                margin: 10px;
                border-radius: 12px;
            }
            
            .btn-link {
                padding: 15px 25px;
                font-size: 15px;
                width: 80%;
                max-width: 200px;
            }
            
            .button-container {
                margin: 25px 0;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 5px;
            }
            
            .btn-link {
                padding: 12px 20px;
                font-size: 14px;
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p>{{ recipient.name }} 様</p>
        <p>以下のセミナーへのご参加ありがとうございます。</p>
        <p><strong>{{ seminar.title }}</strong></p>
        <p>会場に到着されましたら、以下の「確認」ボタンをクリックしてください。</p>
        
        <div class="button-container">
            <!--[if mso]>
            <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="https://seminar-attendance.onrender.com/confirm?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}" style="height:50px;v-text-anchor:middle;width:200px;" arcsize="10%" stroke="f" fillcolor="#000000">
                <w:anchorlock/>
                <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">確認</center>
            </v:roundrect>
            <![endif]-->
            <!--[if !mso]><!-- -->
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" class="btn-table">
                <tr>
                    <td class="btn-cell">
                        <a href="https://seminar-attendance.onrender.com/confirm?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}" 
                           class="btn-link"
                           style="display:inline-block;padding:15px 30px;color:white;text-decoration:none;font-weight:bold;font-size:16px;border-radius:5px;background-color:#000000;border:none;font-family:Arial,sans-serif;">
                           確認
                        </a>
                    </td>
                </tr>
            </table>
            <!--<![endif]-->
        </div>
        
        <p style="font-size: 12px; color: #000000; margin-top: 30px;">
            ※ ボタンが機能しない場合は、以下のリンクをクリックするか、コピーしてブラウザのアドレスバーに貼り付けてください：<br>
            <a href="https://seminar-attendance.onrender.com/confirm?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}" style="color: #000000; word-break: break-all;">
                https://seminar-attendance.onrender.com/confirm?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}
            </a>
        </p>
    </div>
</body>
</html>
