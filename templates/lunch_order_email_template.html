<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ランチ注文のご案内</title>
    <!--[if mso]>
    
    <![endif]-->
    
</head>
<body>
    <div style="background-color: #f3f4f6; padding: 20px 10px; min-height: 100vh;">
        <div class="email-container">
            <!-- Header -->
            <div class="header-section">
                <h1 class="header-title">🍽️ {{ session_title }}</h1>
                <p class="header-subtitle">ランチ注文のご案内</p>
            </div>
            
            <!-- Content -->
            <div class="content-section">
                <!-- Deadline Notice -->
                <div class="deadline-notice">
                    ⏰ 注文期限: {{ deadline_formatted }}
                </div>
                
                <!-- Order Button Section -->
                <div class="order-section">
                    <p class="order-instruction">
                        下記ボタンから注文フォームにアクセスして、<br>お好みのメニューをご注文ください
                    </p>
                    <a href="https://seminar-attendance.onrender.com/lunch_order_form?session={{ session_title_encoded }}&orderer_id={{ orderer.id }}&deadline={{ deadline_iso|urlencode }}" 
                       class="order-button">
                        📱 注文フォームを開く
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
