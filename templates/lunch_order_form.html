<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランチ注文フォーム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
    <div class="container">
        <h1>ランチ注文フォーム</h1>
        <p>注文期限: {{ deadline }}</p>
        <p>注文者: {{ orderer.name }} 様</p>

        <form method="GET" action="https://seminar-attendance.onrender.com/lunch_order_response">
            <input type="hidden" name="session_title" value="{{ session_title }}">
            <input type="hidden" name="orderer_id" value="{{ orderer.id }}">
            <input type="hidden" name="deadline" value="{{ deadline }}">
            <h2>メニュー一覧</h2>
            {% for menu in menus %}
                <label>
                    <input type="checkbox" name="items" value="{{ menu.id }}">
                    {{ menu.name }} ¥{{ menu.price_excl_tax | round(0) | int }}
                </label><br>
            {% endfor %}
            <button type="submit" class="btn btn-primary">注文を確定する</button>
        </form>
    </div>
</body>
</html>
