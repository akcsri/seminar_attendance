<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランチ注文フォーム</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.15);
            border: 1px solid #e9ecef;
        }
        
        h1 {
            color: #6c5ce7;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .menu-item {
            background: #f8f9fa;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .menu-item:hover {
            border-color: #6c5ce7;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.15);
        }
        
        .menu-item label {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 1.1em;
        }
        
        .menu-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #6c5ce7;
        }
        
        .menu-price {
            color: #6c5ce7;
            font-weight: bold;
            margin-left: auto;
        }
        
        .submit-section {
            text-align: center;
            margin-top: 40px;
        }
        
        .btn {
            background: linear-gradient(135deg, #6c5ce7, #74b9ff);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.35);
        }
        
        .session-info {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 5px solid #6c5ce7;
        }
        
        .session-info h3 {
            color: #2d3436;
            margin-top: 0;
            font-size: 1.4em;
        }
        
        .session-info p {
            color: #636e72;
            margin: 8px 0;
        }
        
        .session-info strong {
            color: #2d3436;
        }
    </style>
    <script>
        function submitOrder() {
            const checkboxes = document.querySelectorAll('input[name="items"]:checked');
            const selectedItems = Array.from(checkboxes).map(cb => cb.value);
            
            if (selectedItems.length === 0) {
                alert('メニューを選択してください！ 🍽️');
                return false;
            }
            
            const params = new URLSearchParams();
            params.append('session_title', '{{ session_title }}');
            params.append('orderer_id', '{{ orderer.id }}');
            params.append('deadline', '{{ deadline }}');
            selectedItems.forEach(item => params.append('items', item));
            
            window.location.href = '/lunch_order_response?' + params.toString();
            return false;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>ランチ注文フォーム</h1>
        
        <div class="session-info">
            <h3>{{ session_title }}</h3>
            {% if deadline %}
            <p><strong>注文期限:</strong> {{ deadline }}</p>
            {% endif %}
            <p><strong>注文者:</strong> {{ orderer.name }} 様</p>
        </div>
        
        <form onsubmit="return submitOrder()">
            <input type="hidden" name="session_title" value="{{ session_title }}">
            <input type="hidden" name="orderer_id" value="{{ orderer.id }}">
            <input type="hidden" name="deadline" value="{{ deadline }}">
            
            <h3>メニュー選択（複数選択可）</h3>
            
            {% for menu in menus %}
            <div class="menu-item">
                <label>
                    <input type="checkbox" name="items" value="{{ menu.id }}">
                    <span>{{ menu.name }}</span>
                    <span class="menu-price">¥{{ menu.price_excl_tax }}</span>
                </label>
            </div>
            {% endfor %}
            
            <div class="submit-section">
                <button type="submit" class="btn">注文を確定する</button>
            </div>
        </form>
    </div>
</body>
</html>
