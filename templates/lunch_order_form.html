
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランチ注文フォーム</title>
    <link rel="stylesheet" href="base.css">
</head>
<body>
    <div class="container">
        <h1>ランチ注文フォーム</h1>
        <p>注文期限: {{ deadline }}</p>
        <p>注文者: {{ orderer.name }} 様</p>

        <form method="POST" action="{{ url_for('submit_order') }}">
            <h2>メニューを選択してください</h2>
            <div class="detail-section">
                {% for menu in available_menus %}
                <label>
                    <input type="checkbox" name="menu_ids" value="{{ menu.id }}">
                    {{ menu.name }} - {{ menu.price_excl_tax }}円
                </label>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary">注文を確定する</button>
        </form>
    </div>
</body>
</html>
