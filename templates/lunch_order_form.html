<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ランチ注文フォーム</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.15);
            border: 1px solid #e3f2fd;
        }
        
        h1 {
            color: #3498db;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 0 2px 4px rgba(52, 152, 219, 0.1);
        }
        
        .menu-item {
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            border: 2px solid #e3f2fd;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1);
        }
        
        .menu-item:hover {
            border-color: #3498db;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.2);
            transform: translateY(-2px);
        }
        
        .menu-item label {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 1.1em;
        }
        
        .menu-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #3498db;
        }
        
        .menu-price {
            color: #e74c3c;
            font-weight: bold;
            margin-left: auto;
            background: linear-gradient(135deg, #ffe5e5, #fff1f1);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #fadbd8;
        }
        
        .submit-section {
            text-align: center;
            margin-top: 40px;
        }
        
        .btn {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
        }
        
        .session-info {
            background: linear-gradient(135deg, #e8f5e8, #f0f8f0);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 5px solid #27ae60;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.1);
        }
        
        .session-info h3 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.4em;
        }
        
        .session-info p {
            color: #34495e;
            margin: 8px 0;
        }
        
        .session-info strong {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ランチ注文フォーム</h1>
        
        <div class="session-info">
            <h3>{{ session_title }}</h3>
            {% if deadline %}
            <p><strong>注文期限:</strong> {{ deadline }}</p>
            {% endif %}
            <p><strong>注文者:</strong> {{ orderer.name }} 様</p>
        </div>
        
        <form method="GET" action="/lunch_order_response">
            <input type="hidden" name="session_title" value="{{ session_title }}">
            <input type="hidden" name="orderer_id" value="{{ orderer.id }}">
            <input type="hidden" name="deadline" value="{{ deadline }}">
            
            <h3>メニュー選択（複数選択可）</h3>
            
            {% for menu in menus %}
            <div class="menu-item">
                <label>
                    <input type="checkbox" name="items" value="{{ menu.id }}">
                    <span>{{ menu.name }}</span>
                    <span class="menu-price">¥{{ menu.price_excl_tax }}</span>
                </label>
            </div>
            {% endfor %}
            
            <div class="submit-section">
                <button type="submit" class="btn">注文を確定する</button>
            </div>
        </form>
    </div>
</body>
</html>
