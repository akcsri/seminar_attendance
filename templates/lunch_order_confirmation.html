<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>注文確認</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: var(--card-background);
            border-radius: 8px;
            margin-top: 50px;
            text-align: center;
        }
        
        .success-icon {
            font-size: 3em;
            color: #28a745;
            margin-bottom: 20px;
        }
        
        .confirmation-info {
            background: #d4edda;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>注文を受け付けました</h1>
        
        <div class="confirmation-info">
            <p><strong>注文者:</strong> {{ recipient.name }} 様</p>
            <p><strong>セッション:</strong> {{ session.title }}</p>
            <p><strong>選択した品目数:</strong> {{ selected_items|length }} 点</p>
        </div>
        
        <p>ご注文ありがとうございました。</p>
        <p>注文内容の詳細は管理者より別途ご連絡いたします。</p>
    </div>
</body>
</html>
