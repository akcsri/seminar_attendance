
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録者編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <style>
        /* Additional specific styles for edit recipient page */
        .form-group {
            margin-bottom: 25px;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>登録者情報の編集</h1>
        <form method="POST" action="/edit_recipient/{{ recipient.id }}">
            <div class="form-group">
                <label for="name">名前:</label>
                <input type="text" id="name" name="name" value="{{ recipient.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">メール:</label>
                <input type="email" id="email" name="email" value="{{ recipient.email }}" required>
            </div>
            
            <div class="form-group">
                <label for="affiliation">所属:</label>
                <input type="text" id="affiliation" name="affiliation" value="{{ recipient.affiliation }}">
            </div>
            
            <div class="form-group">
                <label for="phone">電話:</label>
                <input type="tel" id="phone" name="phone" value="{{ recipient.phone }}">
            </div>
            
            <button type="submit" class="btn btn-primary">更新</button>
        </form>
        
        <a href="/admin" class="back-link">← 管理画面に戻る</a>
    </div>
</body>
</html>
