
<!DOCTYPE html>
<html>
<head>
    <title> 登録者編集</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        input[type="text"], input[type="email"] {
            border: 1px solid #ccc;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
        }
        input[type="submit"] {
            background-color: #333333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #222222;
        }
        a {
            color: #333333;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>登録者情報の編集</h2>
    <form method="POST" action="/edit_recipient/{{ recipient.id }}">
        <label>名前:</label><br>
        <input type="text" name="name" value="{{ recipient.name }}"><br><br>
        <label>メール:</label><br>
        <input type="email" name="email" value="{{ recipient.email }}"><br><br>
        <label>所属:</label><br>
        <input type="text" name="affiliation" value="{{ recipient.affiliation }}"><br><br>
        <label>電話:</label><br>
        <input type="text" name="phone" value="{{ recipient.phone }}"><br><br>
        <input type="submit" value="更新">
    </form>
    <br>
    <a href="/admin">管理画面に戻る</a>
</body>
</html>
