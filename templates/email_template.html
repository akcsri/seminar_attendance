<!DOCTYPE html>
<html>
<body>
<p>{{ recipient.name }} 様</p>
<p>{{ seminar.title }} のご案内です。</p>
<p>日時: {{ seminar.date }}<br>
会場: {{ seminar.venue }}<br>
講師: {{ seminar.speaker }}<br>
演題: {{ seminar.topic }}<br>
連絡先: {{ seminar.contact }}</p>
<p>以下のボタンから出欠をご回答ください。</p>
<a href="https://seminar-attendance.onrender.com/respond?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}&status=attend" style="background-color: #007BFF; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin: 5px;">出席</a><br>
<a href="https://seminar-attendance.onrender.com/respond?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}&status=absent" style="background-color: #007BFF; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin: 5px;">欠席</a><br>
<a href="https://seminar-attendance.onrender.com/respond?seminar_id={{ seminar.id }}&recipient_id={{ recipient.id }}&status=pending" style="background-color: #007BFF; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; margin: 5px;">保留</a><br>
</body>
</html>
