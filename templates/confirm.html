
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>出欠確認</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        button {
            background-color: #333333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #222222;
        }
        textarea {
            border: 1px solid #ccc;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>出欠状況を更新しました。</h2>
    <form action="/submit_comment" method="POST">
        <input type="hidden" name="seminar_id" value="{{ seminar_id }}">
        <input type="hidden" name="recipient_id" value="{{ recipient_id }}">
        <label for="comment">途中退出予定等の連絡事項があればご記入ください：</label><br>
        <textarea name="comment" rows="4" cols="50"></textarea><br>
        <button type="submit">コメントを送信</button>
    </form>
</body>
</html>
