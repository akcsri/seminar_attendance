
<!DOCTYPE html>
<html>
<head>
    <title>セミナー編集</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        input[type="text"] {
            border: 1px solid #ccc;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
        }
        input[type="submit"] {
            background-color: #333333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #222222;
        }
        a {
            color: #333333;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>セミナー情報の編集</h2>
    <form method="POST" action="/edit_seminar/{{ seminar.id }}">
        <label>タイトル:</label><br>
        <input type="text" name="title" value="{{ seminar.title }}"><br><br>
        <label>日時:</label><br>
        <input type="text" name="date" value="{{ seminar.date }}"><br><br>
        <label>会場:</label><br>
        <input type="text" name="venue" value="{{ seminar.venue }}"><br><br>
        <label>講師:</label><br>
        <input type="text" name="speaker" value="{{ seminar.speaker }}"><br><br>
        <label>トピック:</label><br>
        <input type="text" name="topic" value="{{ seminar.topic }}"><br><br>
        <label>連絡先:</label><br>
        <input type="text" name="contact" value="{{ seminar.contact }}"><br><br>
        <input type="submit" value="更新">
    </form>
    <br>
    <a href="/admin">管理画面に戻る</a>
</body>
</html>
