
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セミナー編集</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <style>
        /* Additional specific styles for edit seminar page */
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-row > div {
            flex: 1;
        }
        
        .help-text {
            font-size: 13px;
            color: var(--light-gray);
            margin-top: 8px;
            font-style: italic;
            line-height: 1.4;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        
        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container container-wide">
        <h1>セミナー情報の編集</h1>
        <form method="POST" action="/edit_seminar/{{ seminar.id }}">
            <div class="form-group">
                <label for="title">タイトル:</label>
                <input type="text" id="title" name="title" value="{{ seminar.title }}" placeholder="例: 最新AI技術セミナー">
            </div>
            
            <div class="form-group">
                <label for="date">日時:</label>
                <input type="datetime-local" id="date" name="date" value="{{ seminar.date.strftime('%Y-%m-%dT%H:%M') if seminar.date else '' }}" title="開始時刻を設定してください">
                <div class="help-text">※ 開始時刻を設定してください。開場時刻や終了時刻は下記フィールドで設定可能です。</div>
            </div>
            
            <div class="form-group">
                <label for="venue">会場:</label>
                <textarea id="venue" name="venue" rows="4">{{ seminar.venue or '' }}</textarea>
                <div class="help-text">※ 詳細な住所や交通アクセスも記載可能です。</div>
            </div>
            
            <div class="form-group">
                <label for="speaker">講師:</label>
                <input type="text" id="speaker" name="speaker" value="{{ seminar.speaker }}" placeholder="例: 田中博士 (東京大学)">
                <div class="help-text">※ 肩書きや所属も併記可能です。</div>
            </div>
            
            <div class="form-row">
                <div>
                    <label for="open_time">開場時刻:</label>
                    <input type="time" id="open_time" name="open_time" value="{{ seminar.open_time.strftime('%H:%M') if seminar.open_time else '' }}" placeholder="例: 18:00">
                    <div class="help-text">※ 任意: セミナー開場時刻</div>
                </div>
                <div>
                    <label for="end_time">終了時刻:</label>
                    <input type="time" id="end_time" name="end_time" value="{{ seminar.end_time.strftime('%H:%M') if seminar.end_time else '' }}" placeholder="例: 20:00">
                    <div class="help-text">※ 任意: セミナー終了時刻</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="speaker_bio">講師経歴:</label>
                <textarea id="speaker_bio" name="speaker_bio" rows="3" placeholder="講師の詳細経歴をご記入ください（HTML形式可）">{{ seminar.speaker_bio or '' }}</textarea>
                <div class="help-text">※ 任意: 講師の詳細な経歴情報。HTML形式で記述可能です。</div>
            </div>
            
            <div class="form-group">
                <label for="topic">セミナー詳細情報:</label>
                <textarea id="topic" name="topic" rows="8" placeholder="セミナーの詳細内容、概要、注意事項等をご記入ください">{{ seminar.topic }}</textarea>
                <div class="help-text">※ セミナーの詳細内容や概要。メール送信時にそのまま使用されます。</div>
            </div>
            
            <div class="form-group">
                <label for="contact">連絡先:</label>
                <input type="text" id="contact" name="contact" value="{{ seminar.contact }}" placeholder="例: seminar@example.com / 03-1234-5678">
                <div class="help-text">※ メールアドレスや電話番号を記載してください。</div>
            </div>
            
            <button type="submit" class="btn btn-primary">更新</button>
        </form>
        
        <a href="/admin" class="back-link">← 管理画面に戻る</a>
    </div>
</body>
</html>
